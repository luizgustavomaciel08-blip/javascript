<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de JS</title>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Começando JS</p>
    <script>
        var n1 = Number(window.prompt('Digite um número: ')) /*window.prompt retorna uma STRING, mesmo que eu escreva um número*/
        var n2 = Number(window.prompt('Digite outro número: '))
        var s = n1 + n2
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`)
        /*existe o '+' para concatenação e o '+' para soma*/

        /*'Number.parseInt' converte a string em número INTEIRO*/
        /*'Number.parseFloat' converte a string em número DECIMAL*/
        /*'Number()' converte a string em número*/
        /*'String()' converte a número em string*/
        /*'${s}' é um placeholder de formatação de string*/
    </script>
</body>
</html>
