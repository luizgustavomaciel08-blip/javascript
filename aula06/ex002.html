<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de JS</title>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Começando JS</p>
    <script>
        var nome = window.prompt('Qual é o seu nome?') /*pode usar var ou let*/
        window.alert('É um prazer em te conhecer, ' + nome + '!') /*o + serve para concatenar, ou seja, juntar o texto com a variável*/
    </script>
</body>
</html>
