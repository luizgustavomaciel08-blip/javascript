<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicionais</title>
</head>
<body>
    <h1>Brasileiro ou Estrangeiro?</h1>
    <p>Qual o seu país: <input type="text" name="txtnac" id="txtnac"> <input type="button" value="Verificar" onclick="verificar()"></p>
    <div id="res">

    </div>

    <script>
        function verificar(){
            let txtn = document.getElementById('txtnac')
            let res = document.getElementById('res')
            let nac = txtn.value
            res.innerHTML = `<p>Você veio do(a) <strong>${nac}</strong></p>`

            if(nac == 'Brasil' || nac == 'brasil'){
                res.innerHTML += `<p>Você é <strong>BRASILEIRO</strong></p>`
            } else {
                res.innerHTML += `<p>Você é <strong>ESTRANGEIRO</strong></p>`
            }
        }
    </script>
</body>
</html>
